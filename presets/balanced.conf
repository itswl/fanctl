# balanced (default)
# Light loads stay with macOS, so the fans can stop. Under sustained load fanctl takes over
# a little earlier and runs the fans a little faster than macOS would on its own.
#
# Temperatures are PMU temperatures (`fanctl temp`), not CPU core temperatures: about 45 °C
# idle and 50-60 °C under everyday load on a 14-inch M3 Pro. Settings: see README.

interval 3
auto_below 55
auto_hysteresis 5

curve_pct 50 1
curve_pct 60 13
curve_pct 70 35
curve_pct 80 64
curve_pct 90 91
curve_pct 95 100
