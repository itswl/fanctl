# cool
# Cooling first, noise second: takes over at 48 °C and ramps up early. For long builds,
# renders or model runs. Audible under medium load.
#
# Temperatures are PMU temperatures (`fanctl temp`). Settings: see README.

interval 3
auto_below 48
auto_hysteresis 3

curve_pct 45 2
curve_pct 55 20
curve_pct 65 46
curve_pct 75 73
curve_pct 85 93
curve_pct 90 100
