# lap
# Keeps a steady airflow so the bottom of the case stays cool on your lap. auto_below is
# under the idle temperature, so fanctl always drives the fans (about 2700-2900 rpm at
# 40-50 °C on a 14-inch M3 Pro). Costs a faint noise at idle and 1-2 W; use balanced at a desk.
#
# Temperatures are PMU temperatures (`fanctl temp`). Settings: see README.

interval 3
auto_below 40
auto_hysteresis 3

curve_pct 40 7
curve_pct 50 12
curve_pct 60 22
curve_pct 70 42
curve_pct 80 68
curve_pct 90 92
curve_pct 95 100
