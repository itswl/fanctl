# quiet
# Stays out of the way until the machine is clearly warm: below 62 °C macOS keeps the fans
# (they usually stay off). Long full loads run a few degrees warmer than with balanced.
#
# Temperatures are PMU temperatures (`fanctl temp`). Settings: see README.

interval 5
auto_below 62
auto_hysteresis 6

curve_pct 60 0
curve_pct 70 11
curve_pct 80 33
curve_pct 90 64
curve_pct 95 100
