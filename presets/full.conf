# full
# Every fan at full speed, all the time: burn-in, benchmarks, or getting rid of heat fast. Loud.
# fanctl takes over on the first check and never hands back; switch back with
# `sudo fanctl preset balanced`.
#
# Settings: see README.

interval 5
auto_below 0
auto_hysteresis 0
confirm_up 1

curve_pct 0 100
curve_pct 100 100
